services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: week11-localstack

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      - SERVICES=s3
      - DEBUG=0
      - PERSISTENCE=1

    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  localstack-data:
